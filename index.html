<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Inventario</title>
    <!-- Librería para el escáner -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; margin: auto; }
        #reader { width: 100%; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background-color: #007bff; color: white; border: none; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #status { margin-top: 15px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <h2>Auditoría de Repuestos</h2>
    
    <!-- Contenedor de la cámara -->
    <div id="reader"></div>

    <div class="form-group">
        <label for="codigo">Código de Repuesto:</label>
        <input type="text" id="codigo" readonly placeholder="Se autocompletará al escanear">
    </div>

    <div class="form-group">
        <label for="cantidad">Cantidad Contada:</label>
        <input type="number" id="cantidad" placeholder="Ingrese el recuento físico">
    </div>

    <button id="enviarBtn" onclick="enviarDatos()">Guardar Registro</button>
    <div id="status"></div>

    <script>
        // Inicializar el escáner
        const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 100} }, false);

        function onScanSuccess(decodedText, decodedResult) {
            // Rellenar el input con el código escaneado
            document.getElementById('codigo').value = decodedText;
            
            // Pausar escáner para evitar lecturas múltiples
            html5QrcodeScanner.pause(true);
            document.getElementById('status').innerText = "Código detectado. Ingrese cantidad.";
            document.getElementById('status').style.color = "green";
        }

        html5QrcodeScanner.render(onScanSuccess);

        // Función para enviar datos a Google Sheets
        function enviarDatos() {
            const codigo = document.getElementById('codigo').value;
            const cantidad = document.getElementById('cantidad').value;
            const statusDiv = document.getElementById('status');
            const urlAppScript = https://script.google.com/macros/s/AKfycbzsM_gBkQ6jG-vyiRWBVDnJBI9haNYj5YBUyysVdkUC3FYlX07QYu4zISL0YS4-mtae/exec; // <-- REEMPLAZAR AQUÍ

            if(!codigo || !cantidad) {
                statusDiv.innerText = "Error: Escanee un código e ingrese una cantidad.";
                statusDiv.style.color = "red";
                return;
            }

            statusDiv.innerText = "Enviando datos...";
            statusDiv.style.color = "blue";

            // Preparar datos en formato URL-encoded para evitar problemas de CORS en GAS
            const formData = new URLSearchParams();
            formData.append('codigo', codigo);
            formData.append('cantidad', cantidad);

            fetch(urlAppScript, {
                method: 'POST',
                body: formData
            })
            .then(response => response.text())
            .then(data => {
                statusDiv.innerText = "Registro guardado exitosamente.";
                statusDiv.style.color = "green";
                
                // Limpiar campos y reanudar cámara
                document.getElementById('codigo').value = '';
                document.getElementById('cantidad').value = '';
                html5QrcodeScanner.resume();
            })
            .catch(error => {
                statusDiv.innerText = "Error de conexión.";
                statusDiv.style.color = "red";
                console.error('Error:', error);
            });
        }
    </script>
</body>
</html>
